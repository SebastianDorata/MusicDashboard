<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Top Albums preview: 20 rows, click opens the album in My Library; "View All" opens the modal (10 per page) -->
<th:block th:fragment="section">
    <h1 class="txt-white-bld-thirty txt-centre-underline analytics-title">Top Albums</h1>
    <button type="button" class="view-All" data-modal="albums" data-title="Top Albums">View All</button>
    <div class="analytics-preview">
        <div class="analytics-list-item clickable" th:each="r : ${albumRows}"
             th:attr="data-album-id=${r.albumId()}">
            <span class="txt-white-sm row-primary" th:text="${r.albumTitle() != null ? r.albumTitle() : '—'}">Album</span>
            <span class="analytics-row-meta" th:text="'(' + ${r.releaseYear()} + ')'">(2020)</span>
        </div>
    </div>
</th:block>
</body>
</html>
