# Runs the MusicDashboard web edition with its PostgreSQL database.
#
#   docker compose up --build        build the image and start both containers
#   docker compose down              stop them (the data volumes are kept)
#
# Settings, read from the shell or from a .env file next to this file
# (copy .env.example to .env to start):
#   DB_PASSWORD           required: the PostgreSQL password
#   MUSICDASHBOARD_PORT   host port to publish (default 8080)
#   MUSIC_DIR             host folder with your music (default ~/Music)

# A fixed project name keeps the volume and network names the same wherever
# this folder lives or whatever it is called.
name: musicdashboard-web

services:
  db:
    image: postgres:18
    container_name: musicdashboard-db
    environment:
      POSTGRES_DB: MusicDashDB
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD, for example in a .env file next to docker-compose.yml}
    volumes:
      # From version 18 the official image keeps its data under /var/lib/postgresql.
      - musicdashboard-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d MusicDashDB"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  musicdashboard-web:
    build: .
    image: musicdashboard-web:latest
    container_name: musicdashboard-web
    depends_on:
      db:
        # Wait until PostgreSQL accepts connections, so the schema migration can run.
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD, for example in a .env file next to docker-compose.yml}
    ports:
      - "${MUSICDASHBOARD_PORT:-8080}:8080"
    volumes:
      # Files uploaded through the browser. A named volume, so they survive
      # rebuilding or removing the container.
      - musicdashboard-data:/data
      # Your music, visible inside the container as /music. On the Import page,
      # enter /music as the folder to scan. It is mounted read-write because the
      # importer saves embedded cover art as cover.jpg beside the audio files;
      # append ":ro" to forbid that (albums then show the placeholder icon).
      - ${MUSIC_DIR:-${HOME}/Music}:/music
    restart: unless-stopped

volumes:
  musicdashboard-data:
  musicdashboard-db:
